<!DOCTYPE html>
<html lang="it" class="chatbot-page-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chatbot GustAvo — IIS Avogadro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/img/gustavo_icon.png">
    <link rel="apple-touch-icon" href="assets/img/gustavo_icon.png">
    <link rel="stylesheet" href="assets/css/style.css?v=3.5">
    <script src="assets/js/main.js" defer></script>
    <style>
        /* Regole di sicurezza viewport mobile e overlay menu hamburger */
        html.chatbot-page-html,
        body.chatbot-page {
            height: 100%;
            height: -webkit-fill-available;
            height: 100dvh;
            min-height: 0 !important;
            max-height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .nav-mobile {
            position: absolute !important;
            top: 100% !important;
            left: 0 !important;
            right: 0 !important;
            width: 100% !important;
            z-index: 1001 !important;
            box-shadow: 0 14px 28px rgba(0, 30, 80, 0.25) !important;
        }
        .chatbot-direct-bar {
            display: flex !important;
            visibility: visible !important;
            opacity: 1 !important;
            flex-shrink: 0 !important;
        }
        .chatbot-direct-bar .chatbot-bar-note {
            display: inline-block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
    </style>
</head>
<body class="chatbot-page">

    <!-- NAVBAR UFFICIALE GUSTAVO -->
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo-link">
                <span class="nav-logo-box skeleton">
                    <img src="assets/img/gustavo_icon.png" alt="Logo GustAvo" class="nav-logo-icon">
                </span>
                <span class="logo-testo">
                    <span class="logo-nome">GustAvo</span>
                    <span class="logo-motto">Il chatbot che ti orienta a scuola</span>
                </span>
            </a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="progetto.html">Progetto</a></li>
                <li><a href="team.html">Team</a></li>
                <li><a href="documentazione.html">Documentazione</a></li>
                <li><a href="chatbot.html" class="active">Chatbot</a></li>
                <li><a href="galleria.html">Galleria</a></li>
            </ul>

            <button class="hamburger" id="hamburger" aria-label="Menu di navigazione" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </nav>

        <!-- MENU MOBILE TOUCH-FRIENDLY -->
        <nav class="nav-mobile" id="navMobile" aria-hidden="true">
            <a href="index.html">Home</a>
            <a href="progetto.html">Progetto</a>
            <a href="team.html">Team</a>
            <a href="documentazione.html">Documentazione</a>
            <a href="chatbot.html" class="active">Chatbot</a>
            <a href="galleria.html">Galleria</a>
        </nav>
    </header>

    <!-- MAIN CHATBOT WORKSPACE -->
    <main class="chatbot-main">
        <div class="chatbot-iframe-box">
            <iframe
                src="https://gustavo1.avoprogetti.it"
                class="chatbot-iframe"
                title="Chatbot GustAvo — Server Ufficiale gustavo1.avoprogetti.it"
                allow="microphone"
                loading="lazy">
            </iframe>
        </div>

        <!-- BARRA INFORMATIVA SERVER (ANCORATA ALLA BASE DELLA SEZIONE CHATBOT) -->
        <div class="chatbot-direct-bar">
            <span class="chatbot-bar-note">Chatbot ospitato sul server della scuola</span>
            <a href="https://gustavo1.avoprogetti.it" target="_blank" rel="noopener">Apri direttamente gustavo1.avoprogetti.it ↗</a>
        </div>
    </main>

</body>
</html>
